<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting — Diya Das</title>
  <script>
    // GitHub Pages SPA router for /notebook
    (function() {
      const path = window.location.pathname;
      if (path.endsWith('/notebook') || path.endsWith('/notebook/')) {
        window.location.replace('/#notebook');
      } else {
        window.location.replace('/');
      }
    })();
  </script>
</head>
<body style="background:#F5EFE4; color:#171717; font-family:serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0;">
  <p>Loading Diya Das Portfolio &amp; Notebook...</p>
</body>
</html>
